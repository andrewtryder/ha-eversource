name: Live Eversource smoke

# External dependency health check against public Eversource tariff pages.
# This is intentionally NOT a PR merge gate / branch-protection requirement.
on:
  schedule:
    - cron: "17 12 * * *" # daily ~12:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt aiohttp
      - name: Fetch and validate public NH Rate R tariff
        run: python tools/fetch_eversource_rates.py
