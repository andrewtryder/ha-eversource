name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Prefer a GitHub App installation token when both App secrets are configured.
      # Referencing unset secrets in `if:` prevented this workflow from starting jobs.
      - name: Create GitHub App installation token
        id: app-token
        if: ${{ vars.RELEASE_PLEASE_USE_APP == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # App token when enabled via repo variable; otherwise fine-grained PAT.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
